document.getElementById('loading').style.display = 'none';

const scene = new THREE.Scene();
const container = document.getElementById('scene');
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dl = new THREE.DirectionalLight(0xffffff, 0.6);
dl.position.set(1, 1, 1);
scene.add(dl);

// --- bounding box / center of the point cloud, for camera framing ---
let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity, minZ=Infinity, maxZ=-Infinity;
DATA.points.forEach(p => {
  minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]);
  minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]);
  minZ = Math.min(minZ, p[2]); maxZ = Math.max(maxZ, p[2]);
});
const center = new THREE.Vector3((minX+maxX)/2, (minY+maxY)/2, (minZ+maxZ)/2);
const extent = Math.max(maxX-minX, maxY-minY, maxZ-minZ);

// --- structural node point cloud: every node at the actual downsample
// rate used by the simulation (no further random subsampling) ---
const positions = new Float32Array(DATA.points.length * 3);
const colors = new Float32Array(DATA.points.length * 3);
const dimColor = new THREE.Color(0x7a7a8c);
const firedColor = new THREE.Color(0xe8c34a);
DATA.points.forEach((p, i) => {
  positions[i*3] = p[0] - center.x;
  positions[i*3+1] = p[1] - center.y;
  positions[i*3+2] = p[2] - center.z;
  const c = p[3] ? firedColor : dimColor;
  colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
});
const cloudGeo = new THREE.BufferGeometry();
cloudGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
cloudGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const cloudMat = new THREE.PointsMaterial({ size: extent*0.008, vertexColors: true, transparent: true, opacity: 0.7 });
scene.add(new THREE.Points(cloudGeo, cloudMat));

// --- beam-searched path as a red line ---
const pathPts = DATA.path.map(p => new THREE.Vector3(p[0]-center.x, p[1]-center.y, p[2]-center.z));
const pathGeo = new THREE.BufferGeometry().setFromPoints(pathPts);
const pathMat = new THREE.LineBasicMaterial({ color: 0xff4d4f, linewidth: 2 });
scene.add(new THREE.Line(pathGeo, pathMat));

// --- seed / target markers ---
function marker(pt, color, r) {
  const g = new THREE.SphereGeometry(r, 16, 16);
  const m = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4 });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(pt[0]-center.x, pt[1]-center.y, pt[2]-center.z);
  scene.add(mesh);
}
marker(DATA.seed, 0x4ade80, extent*0.02);
marker(DATA.target, 0xef4444, extent*0.02);

// --- lightweight custom orbit camera (drag to rotate, wheel to zoom) ---
let radius = extent * 1.8, theta = Math.PI/4, phi = Math.PI/3;
let dragging = false, lastX = 0, lastY = 0;

function updateCamera() {
  camera.position.x = radius * Math.sin(phi) * Math.sin(theta);
  camera.position.y = radius * Math.cos(phi);
  camera.position.z = radius * Math.sin(phi) * Math.cos(theta);
  camera.lookAt(0, 0, 0);
}
updateCamera();

renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  theta -= (e.clientX - lastX) * 0.006;
  phi = Math.min(Math.max(phi - (e.clientY - lastY) * 0.006, 0.15), Math.PI - 0.15);
  lastX = e.clientX; lastY = e.clientY;
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  radius = Math.min(Math.max(radius * (1 + e.deltaY * 0.001), extent*0.5), extent*6);
  updateCamera();
}, { passive: false });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// slow auto-rotate when idle, for a "live" feel
let idleTimer = 0;
function animate() {
  requestAnimationFrame(animate);
  if (!dragging) {
    idleTimer++;
    if (idleTimer > 60) { theta += 0.0015; updateCamera(); }
  } else {
    idleTimer = 0;
  }
  renderer.render(scene, camera);
}
animate();
